<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convergence -- __DRP_INSTANCE_NAME__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{
    /* The same aeronautical-chart identity as the flight replay and the tree
       explorer: three views of one run should read as one document. */
    --paper:#EDEBE1; --paper-2:#E2DFD2; --panel:#FBFAF5;
    --ink:#1B1F1A; --muted:#585D51; --muted-2:#8A8F80;
    --line:#D3D5C8; --line-2:#BFC2B3;
    --restricted:#8E2F63; --caution:#B23A22; --warn:#9C6B12; --success:#3E7A3C;
    --accent:#2C4F55; --accent-2:#3E7078; --accent-ink:#FFFFFF;
    --f-display:'Familjen Grotesk',system-ui,sans-serif;
    --f-mono:'Courier Prime',ui-monospace,Consolas,monospace;
    --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
    --r:5px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--f-display);
    background-image:radial-gradient(circle at 22% 12%,rgba(255,255,255,.7),transparent 55%);}
  ::selection{background:rgba(44,79,85,.2);}
  button{font-family:inherit;}

  .console{max-width:1440px;margin:0 auto;padding:var(--sp-5) var(--sp-4) var(--sp-6);
    display:flex;flex-direction:column;gap:var(--sp-3);}

  .hud{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
    padding:var(--sp-4) var(--sp-5);display:flex;flex-wrap:wrap;align-items:center;
    justify-content:space-between;gap:var(--sp-4);}
  .eyebrow{font-weight:600;font-size:10px;letter-spacing:.16em;color:var(--accent);
    text-transform:uppercase;}
  .hud h1{font-weight:700;font-size:clamp(21px,3vw,30px);margin:0;letter-spacing:-.01em;
    text-transform:capitalize;}
  .hud .sub{font-family:var(--f-mono);font-size:11px;color:var(--muted-2);margin-top:2px;}
  .winners{display:flex;gap:var(--sp-5);flex-wrap:wrap;}
  .win{display:flex;flex-direction:column;gap:1px;min-width:66px;}
  .win .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:17px;
    line-height:1.2;}
  .win .k{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2);
    font-weight:600;display:flex;align-items:center;gap:4px;}
  .win .k i{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .win.best .v::after{content:" \2605";font-size:11px;color:var(--success);}

  .card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
    padding:var(--sp-3) var(--sp-4);}
  .card h2{margin:0 0 var(--sp-2);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:700;display:flex;justify-content:space-between;
    align-items:baseline;gap:8px;flex-wrap:wrap;}
  .card h2 em{font-style:normal;font-family:var(--f-mono);color:var(--muted-2);
    letter-spacing:0;text-transform:none;font-size:10px;}

  .main-chart{height:clamp(300px,44vh,460px);}
  .main-chart svg{display:block;width:100%;height:100%;}
  .legend{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-family:var(--f-mono);
    font-size:10.5px;color:var(--muted);margin-top:6px;align-items:center;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend i{width:16px;height:0;border-top:2px solid currentColor;display:inline-block;}
  .legend i.thin{border-top-width:1px;opacity:.45;}
  .legend i.dash{border-top-style:dashed;}
  .clipnote{font-family:var(--f-mono);font-size:10px;color:var(--warn);margin-top:4px;}

  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:var(--sp-3);}
  .panel svg{display:block;width:100%;height:150px;}
  .panel .wide{height:170px;}
  .minirows{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
  .mrow{display:grid;grid-template-columns:74px 1fr 46px;gap:7px;align-items:center;
    font-family:var(--f-mono);font-size:10px;color:var(--muted);}
  .mrow .bar{height:7px;background:var(--paper-2);border:1px solid var(--line);
    border-radius:2px;overflow:hidden;}
  .mrow .bar i{display:block;height:100%;}
  .mrow b{text-align:right;color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums;}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:2.5px 0;
    border-bottom:1px dotted var(--line);}
  .kv:last-child{border-bottom:0;}
  .kv span{color:var(--muted);}
  .kv b{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;}
  .kv b.good{color:var(--success);}
  .kv b.bad{color:var(--restricted);}

  .transport{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
    padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);}
  .t-row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;}
  .play-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--accent);
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
    cursor:pointer;flex:none;}
  .play-btn svg{width:13px;height:13px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .seg button{border:0;background:transparent;padding:5px 10px;font-size:10.5px;
    font-family:var(--f-mono);color:var(--muted);cursor:pointer;border-right:1px solid var(--line);}
  .seg button:last-child{border-right:0;}
  .seg button.on{background:var(--accent);color:var(--accent-ink);}
  .clock{margin-left:auto;display:flex;gap:var(--sp-4);font-family:var(--f-mono);font-size:11px;
    color:var(--muted);flex-wrap:wrap;}
  .clock b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .scrub{position:relative;height:32px;cursor:pointer;outline:none;}
  .scrub .track{position:absolute;left:0;right:0;top:12px;height:8px;background:var(--paper-2);
    border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .scrub .fill{position:absolute;inset:0 100% 0 0;background:var(--accent-2);opacity:.5;}
  .scrub .head{position:absolute;top:5px;width:2px;height:22px;background:var(--ink);
    border-radius:1px;pointer-events:none;}
  .scrub .head::after{content:"";position:absolute;left:-3px;top:-4px;width:8px;height:8px;
    background:var(--ink);border-radius:50%;}
  .scrub:focus-visible .track{border-color:var(--accent);}
  .axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9.5px;
    color:var(--muted-2);}
  .caveat{font-size:10.5px;color:var(--muted-2);font-family:var(--f-mono);line-height:1.55;}
  .caveat b{color:var(--caution);}

  .tip{position:fixed;pointer-events:none;opacity:0;transform:translate(-50%,-135%);
    background:var(--ink);color:var(--paper);padding:5px 8px;border-radius:4px;
    font-family:var(--f-mono);font-size:10.5px;white-space:pre;z-index:20;line-height:1.5;}

  /* shown only when the GSAP request failed -- see the guard at the top of the
     script; without it the page is a shell of empty panels with no explanation */
  .offline-note{max-width:640px;margin:12vh auto;padding:0 24px;
    font-family:system-ui,sans-serif;color:#1B1F1A;line-height:1.6;}
  .offline-note h1{font-size:20px;margin:0 0 12px;}
  .offline-note p{margin:0 0 12px;color:#585D51;font-size:14px;}
  .offline-note code{font-family:ui-monospace,Consolas,monospace;font-size:13px;
    background:#E2DFD2;padding:1px 4px;border-radius:3px;}
</style>
</head>
<body>
<div class="console">

  <header class="hud">
    <div>
      <div class="eyebrow">Metaheuristics &middot; convergence</div>
      <h1 id="ttl">&mdash;</h1>
      <div class="sub" id="sub">&mdash;</div>
    </div>
    <div class="winners" id="winners"></div>
  </header>

  <section class="card">
    <h2><span>Best so far, and the solution each method is actually holding</span>
        <em id="axisNote">&mdash;</em></h2>
    <div class="main-chart"><svg id="chartMain"></svg></div>
    <div class="legend" id="legendMain"></div>
    <div class="clipnote" id="clipNote"></div>
  </section>

  <div class="panels" id="panels"></div>

  <footer class="transport">
    <div class="t-row">
      <button class="play-btn" id="playBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.5v13l11-6.5z"/></svg>
      </button>
      <div class="seg" id="speedGroup">
        <button data-s="0.5">0.5&times;</button>
        <button data-s="1" class="on">1&times;</button>
        <button data-s="4">4&times;</button>
      </div>
      <div class="seg" id="axisGroup">
        <button data-x="t" class="on">seconds</button>
        <button data-x="step">steps</button>
      </div>
      <div class="seg" id="fitGroup" title="Vertical range of the main chart">
        <button data-fit="best" class="on">fit best</button>
        <button data-fit="all">fit all</button>
      </div>
      <div class="clock">
        <span>AT <b id="rdX">0</b></span>
        <span id="rdBests"></span>
      </div>
    </div>
    <div class="scrub" id="scrub" role="slider" tabindex="0"
         aria-label="Search progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="track"><div class="fill" id="scrubFill"></div></div>
      <div class="head" id="scrubHead"></div>
    </div>
    <div class="axis"><span id="axStart">0</span><span id="axMid">&mdash;</span><span id="axEnd">&mdash;</span></div>
    <div class="caveat" id="caveat"></div>
  </footer>

</div>
<div class="tip" id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
"use strict";

// Every element on this page is built by this script, and this script needs
// GSAP -- which is the one thing the file does not carry inside it. If that
// request failed, the page would otherwise render as a shell of empty panels
// and em-dashes with nothing to explain it.
if (typeof gsap === "undefined"){
  document.body.innerHTML =
    '<div class="offline-note">' +
    '<h1>This page could not load GSAP</h1>' +
    '<p>The file is self-contained apart from one thing: it fetches the GSAP ' +
    'animation library from <code>cdnjs.cloudflare.com</code>, and its two ' +
    'typefaces from Google Fonts, when you open it. That request did not ' +
    'succeed — most likely this machine is offline, or something is ' +
    'blocking the CDN.</p>' +
    '<p>Reconnect and reload. Nothing else is missing: the instance and every ' +
    'search trace are inside this file already.</p>' +
    '</div>';
  return;
}

const DATA = __DRP_DASH_DATA_JSON__;
const NS = "http://www.w3.org/2000/svg";

let reduced = false;
gsap.matchMedia().add("(prefers-reduced-motion: reduce)", () => { reduced = true; });

// ---------- theme (roadmap 2.5) ----------
// Every colour that carries a *meaning* lives in Python (`drp/viz/theme.py`)
// and travels in the payload, so `--theme safe` / `--theme chart` switches this
// page, the matplotlib figures and the other two pages together; there is no
// second copy of a palette anywhere in the repository.
const THEME = (DATA && DATA.theme) || null;
// CSS custom property <- theme token. The stylesheet above is written against
// these names, so pushing the tokens through here is what makes the HTML
// chrome and the SVG agree on one palette.
const CSS_VARS = {
  "--paper":"paper", "--paper-2":"paper2", "--panel":"panel", "--ink":"ink",
  "--muted":"muted", "--muted-2":"muted2", "--line":"line", "--line-2":"line2",
  "--restricted":"restricted", "--caution":"caution", "--warn":"warn",
  "--success":"success", "--accent":"accent", "--accent-2":"accent2",
  "--water":"water",
};
function applyTheme(tokens){
  if (!tokens) return;
  const root = document.documentElement.style;
  for (const k in CSS_VARS){ if (tokens[CSS_VARS[k]]) root.setProperty(k, tokens[CSS_VARS[k]]); }
}

const C = Object.assign({
  ink:"#1B1F1A", muted:"#585D51", muted2:"#8A8F80", line:"#D3D5C8", line2:"#BFC2B3",
  paper:"#EDEBE1", paper2:"#E2DFD2", panel:"#FBFAF5",
  accent:"#2C4F55", accent2:"#3E7078", restricted:"#8E2F63", caution:"#B23A22",
  warn:"#9C6B12", success:"#3E7A3C", water:"#BCD3D8",
}, THEME ? THEME.tokens : {});
applyTheme(THEME ? THEME.tokens : null);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const fmt = (v,d) => (v===null||v===undefined||!isFinite(v)) ? "–" : v.toFixed(d===undefined?1:d);

function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function h(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

// ===========================================================================
// the runs
// ===========================================================================
const RUNS = DATA.methods.map(m => {
  const S = m.trace.samples;
  return {
    ...m,
    samples: S,
    xs_t: S.map(s => s.t),
    xs_step: S.map(s => s.step),
    hasTemp: S.some(s => s.temp !== undefined),
    hasPop: S.some(s => s.mean !== undefined && s.mean !== null),
    segments: m.trace.segments,
    events: m.trace.events,
  };
});
const REF = DATA.reference;
let axisMode = "t";                      // "t" (seconds) or "step"

function xsOf(r){ return axisMode === "t" ? r.xs_t : r.xs_step; }
function xMax(){
  return axisMode === "t" ? DATA.meta.t_max : DATA.meta.step_max;
}
// The domain starts at the first sample any run produced, not at zero: the
// first iteration takes a few milliseconds, and a domain starting at 0 leaves a
// sliver where every readout reads "-" -- which is where Home lands.
function xMin(){
  let lo = Infinity;
  RUNS.forEach(r => { const xs = xsOf(r); if (xs.length) lo = Math.min(lo, xs[0]); });
  return isFinite(lo) ? lo : 0;
}
function xSpan(){ return Math.max(1e-9, xMax() - xMin()); }
// index of the last sample at or before x
function idxAt(r, x){
  const xs = xsOf(r);
  let lo = 0, hi = xs.length - 1, ans = -1;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (xs[mid] <= x){ ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

// ===========================================================================
// a small chart in real pixel space
// ===========================================================================
// Charts are drawn in the SVG's own pixel size rather than a fixed viewBox
// stretched to fit: `preserveAspectRatio="none"` would keep the lines but
// squash every label and dot with them.
function makeChart(svg, opts){
  const o = Object.assign({padL:46, padR:12, padT:12, padB:22,
                           yTicks:4, xTicks:5, yFmt:v=>fmt(v,0)}, opts||{});
  const gGrid = el("g", {}), gData = el("g", {}), gAxis = el("g", {}), gHead = el("g", {});
  svg.appendChild(gGrid); svg.appendChild(gData); svg.appendChild(gAxis); svg.appendChild(gHead);
  const head = el("line", {stroke:C.ink, "stroke-width":1, "stroke-opacity":0.5,
                           "stroke-dasharray":"3 3"});
  gHead.appendChild(head);

  const ch = {
    svg, gGrid, gData, gAxis, w:300, h:150,
    y0:o.yLo, y1:o.yHi,
    px(x){ const f = (x - ch.x0) / (ch.x1 - ch.x0 || 1);
           return o.padL + f * (ch.w - o.padL - o.padR); },
    py(v){ const f = (v - ch.y0) / (ch.y1 - ch.y0 || 1);
           return ch.h - o.padB - f * (ch.h - o.padT - o.padB); },
    x0:0, x1:1,
    layout(){
      const r = svg.getBoundingClientRect();
      ch.w = Math.max(120, r.width); ch.h = Math.max(80, r.height);
      svg.setAttribute("viewBox", `0 0 ${ch.w} ${ch.h}`);
      svg.setAttribute("preserveAspectRatio", "none");
    },
    grid(){
      gGrid.textContent = ""; gAxis.textContent = "";
      for (let i = 0; i <= o.yTicks; i++){
        const v = ch.y0 + (ch.y1 - ch.y0) * i / o.yTicks;
        const y = ch.py(v);
        gGrid.appendChild(el("line", {x1:o.padL, y1:y.toFixed(1), x2:(ch.w-o.padR).toFixed(1),
          y2:y.toFixed(1), stroke:C.line, "stroke-width":1,
          "stroke-opacity": i === 0 ? 1 : 0.55}));
        const t = el("text", {x:(o.padL-6).toFixed(1), y:(y+3).toFixed(1), "text-anchor":"end",
          "font-family":"Courier Prime", "font-size":9, fill:C.muted2});
        t.textContent = o.yFmt(v);
        gAxis.appendChild(t);
      }
      for (let i = 0; i <= o.xTicks; i++){
        const v = ch.x0 + (ch.x1 - ch.x0) * i / o.xTicks;
        const x = ch.px(v);
        const t = el("text", {x:x.toFixed(1), y:(ch.h-6).toFixed(1),
          "text-anchor": i === 0 ? "start" : (i === o.xTicks ? "end" : "middle"),
          "font-family":"Courier Prime", "font-size":9, fill:C.muted2});
        t.textContent = o.xFmt ? o.xFmt(v) : fmt(v, axisMode === "t" ? 1 : 0);
        gAxis.appendChild(t);
      }
      head.setAttribute("y1", o.padT); head.setAttribute("y2", ch.h - o.padB);
    },
    setHead(x){
      const px = ch.px(clamp(x, ch.x0, ch.x1));
      head.setAttribute("x1", px.toFixed(1)); head.setAttribute("x2", px.toFixed(1));
    },
    line(pts, attrs){
      if (pts.length < 2) return null;
      let d = "";
      pts.forEach((p, i) => { d += (i ? " L" : "M") + `${ch.px(p[0]).toFixed(1)},${ch.py(p[1]).toFixed(1)}`; });
      const path = el("path", Object.assign({d, fill:"none", "stroke-linejoin":"round",
        "stroke-linecap":"round"}, attrs));
      gData.appendChild(path);
      return path;
    },
    area(pts, attrs){   // pts: [x, lo, hi]
      if (pts.length < 2) return null;
      let d = "M";
      pts.forEach((p, i) => { d += (i ? " L" : "") + `${ch.px(p[0]).toFixed(1)},${ch.py(p[2]).toFixed(1)}`; });
      for (let i = pts.length - 1; i >= 0; i--){
        d += ` L${ch.px(pts[i][0]).toFixed(1)},${ch.py(pts[i][1]).toFixed(1)}`;
      }
      d += " Z";
      const path = el("path", Object.assign({d, stroke:"none"}, attrs));
      gData.appendChild(path);
      return path;
    },
    clear(){ gData.textContent = ""; },
  };
  return ch;
}

// ===========================================================================
// header
// ===========================================================================
document.getElementById("ttl").textContent = DATA.instance.name;
document.title = `Convergence -- ${DATA.instance.name}`;
document.getElementById("sub").textContent =
  `n=${DATA.instance.n_customers} · K=${DATA.instance.fleet.n_drones} · ` +
  RUNS.map(r => `${r.label} ${fmt(r.best_energy,0)} in ${r.wall_time.toFixed(1)}s`).join("  ·  ");

(function(){
  const box = document.getElementById("winners");
  const best = DATA.meta.best_overall;
  RUNS.forEach(r => {
    const w = h("div", "win" + (r.best_energy !== null && best !== null &&
      Math.abs(r.best_energy - best) < 1e-9 ? " best" : ""));
    w.innerHTML = `<div class="v" style="color:${r.color}">${fmt(r.best_energy,0)}</div>` +
      `<div class="k">${legendRule(r.color, r.dash, 2.4)}${r.label}</div>`;
    box.appendChild(w);
  });
  if (REF !== null && REF !== undefined){
    const w = h("div", "win");
    w.innerHTML = `<div class="v" style="color:${C.accent}">${fmt(REF,0)}</div>` +
      `<div class="k"><i style="background:${C.accent}"></i>${DATA.reference_label || "reference"}</div>`;
    box.appendChild(w);
  }
})();

// ===========================================================================
// main chart
// ===========================================================================
const mainSvg = document.getElementById("chartMain");

// Two very different vertical ranges, and the default matters. An SA working
// solution wanders far above every best-so-far curve, so a range that contains
// it squashes all three answers into a band a few pixels tall -- which is the
// one thing this chart exists to show. So the default fits the *best-so-far*
// series (plus the reference floor), and the working solutions are clipped to
// the plot rather than allowed to set the scale. "fit all" restores the full
// range for when the wandering itself is the thing being read.
let yFit = "best";
function yDomain(){
  let lo = Infinity, hi = -Infinity;
  RUNS.forEach(r => r.samples.forEach(s => {
    const vals = yFit === "all" ? [s.best, s.current, s.mean] : [s.best];
    vals.forEach(v => {
      if (v === null || v === undefined || !isFinite(v)) return;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    });
  }));
  // The reference floor is deliberately NOT allowed to set the scale here. On a
  // hard instance the dual bound sits far below every method, and including it
  // spends half the plot on empty space to prove a gap that is better read as a
  // number -- so in "fit best" it becomes an edge marker plus a percentage, and
  // only "fit all" gives it the axis.
  if (yFit === "all" && REF !== null && REF !== undefined && isFinite(REF)){
    lo = Math.min(lo, REF); hi = Math.max(hi, REF);
  }
  if (!isFinite(lo)){ lo = 0; hi = 1; }
  if (hi <= lo) hi = lo + 1;
  const m = (hi - lo) * 0.08;
  return [lo - m, hi + m];
}

const pad = (DATA.meta.e_hi - DATA.meta.e_lo) * 0.06;
const mainCh = makeChart(mainSvg, {padL:56, padB:24, yTicks:4,
  yLo: DATA.meta.e_lo - pad, yHi: DATA.meta.e_hi + pad});
const bestPaths = {};

// The working-solution lines must not draw outside the plot when the scale is
// fitted to the bests.
const mainClip = el("clipPath", {id:"mainPlotClip"});
const mainClipRect = el("rect", {x:0, y:0, width:1, height:1});
mainClip.appendChild(mainClipRect);
const mainDefs = el("defs", {});
mainDefs.appendChild(mainClip);
mainSvg.insertBefore(mainDefs, mainSvg.firstChild);
mainCh.gData.setAttribute("clip-path", "url(#mainPlotClip)");

function drawMain(){
  mainCh.layout();
  mainCh.x0 = xMin(); mainCh.x1 = xMax() || 1;
  const dom = yDomain();
  mainCh.y0 = dom[0]; mainCh.y1 = dom[1];
  mainClipRect.setAttribute("x", 56);
  mainClipRect.setAttribute("y", 0);
  mainClipRect.setAttribute("width", Math.max(1, mainCh.w - 56 - 12));
  mainClipRect.setAttribute("height", Math.max(1, mainCh.h - 24));
  mainCh.grid();
  mainCh.clear();

  if (REF !== null && REF !== undefined){
    const below = REF < mainCh.y0;
    const y = below ? (mainCh.h - 24 - 1) : mainCh.py(REF);
    mainCh.gData.appendChild(el("line", {x1:56, y1:y.toFixed(1),
      x2:(mainCh.w-12).toFixed(1), y2:y.toFixed(1), stroke:C.accent,
      "stroke-width":1.4, "stroke-dasharray": below ? "2 3" : "6 4",
      "stroke-opacity": below ? 0.55 : 0.9}));
    const t = el("text", {x:(mainCh.w-14).toFixed(1), y:(y-5).toFixed(1),
      "text-anchor":"end", "font-family":"Courier Prime", "font-size":9.5,
      fill:C.accent});
    t.textContent = `${DATA.reference_label || "reference"} ${fmt(REF,0)}` +
      (below ? "  (below axis \u2014 use \u201cfit all\u201d)" : "");
    mainCh.gData.appendChild(t);
  }

  // Say so when a curve has been clipped away, rather than letting the legend
  // promise a line the reader cannot find.
  const clipped = RUNS.filter(r => r.samples.some(s =>
    s.current !== null && s.current > mainCh.y1)).map(r => r.label);
  const note = document.getElementById("clipNote");
  note.textContent = clipped.length
    ? `${clipped.join(", ")} working solution runs above this axis \u2014 “fit all” shows it`
    : "";

  RUNS.forEach(r => {
    const xs = xsOf(r);
    // the working solution first, so the best-so-far reads on top of it
    const cur = [];
    r.samples.forEach((s, i) => { if (s.current !== null) cur.push([xs[i], s.current]); });
    mainCh.line(cur, {stroke:r.color, "stroke-width":1, "stroke-opacity":0.3});

    const bst = [];
    r.samples.forEach((s, i) => { if (s.best !== null) bst.push([xs[i], s.best]); });
    // The second channel (roadmap 2.5): three curves crossing in one chart
    // stay three curves without relying on hue. The pattern is the method's,
    // and it is the same one `drp show`'s figures use.
    const bestAttrs = {stroke:r.color, "stroke-width":2.1};
    if (r.dash) bestAttrs["stroke-dasharray"] = r.dash;
    bestPaths[r.method] = mainCh.line(bst, bestAttrs);

    r.events.filter(e => e.kind === "new_best").forEach(e => {
      const x = axisMode === "t" ? e.t : e.step;
      if (e.value === null) return;
      mainCh.gData.appendChild(el("circle", {cx:mainCh.px(x).toFixed(1),
        cy:mainCh.py(e.value).toFixed(1), r:2.4, fill:r.color,
        stroke:C.panel, "stroke-width":1}));
    });
  });
  mainCh.setHead(playX);
}

function legendRule(color, dash, width, opacity){
  const d = dash ? ` stroke-dasharray="${dash}"` : "";
  const o = opacity === undefined ? 1 : opacity;
  return `<svg width="18" height="8" viewBox="0 0 18 8" aria-hidden="true" ` +
         `style="flex:0 0 auto"><line x1="0" y1="4" x2="18" y2="4" ` +
         `stroke="${color}" stroke-width="${width}" stroke-opacity="${o}"${d}/></svg>`;
}

(function(){
  const lg = document.getElementById("legendMain");
  RUNS.forEach(r => {
    // The legend rule is drawn as a tiny SVG rather than a CSS border, so it
    // can carry the *exact* dash pattern the curve uses. A legend that showed
    // a solid rule for a dashed curve would defeat the second channel.
    lg.appendChild(h("span", null,
      `${legendRule(r.color, r.dash, 2)}${r.label} best`));
    lg.appendChild(h("span", null,
      `${legendRule(r.color, r.dash, 1, 0.45)}${r.label} working`));
  });
  if (REF !== null && REF !== undefined){
    lg.appendChild(h("span", null,
      `<i class="dash" style="color:${C.accent}"></i>${DATA.reference_label || "reference"}`));
  }
})();

// ===========================================================================
// per-method panels
// ===========================================================================
const panelBox = document.getElementById("panels");
const panels = [];

RUNS.forEach(r => {
  const card = h("section", "card panel");
  const head = h("h2", null,
    `<span style="color:${r.color}">${r.label}</span>` +
    `<em>seed ${r.seed} · ${r.trace.steps.toLocaleString()} ${r.step_label}s` +
    `${r.trace.stride > 1 ? ` · every ${r.trace.stride}${nth(r.trace.stride)} sampled` : ""}</em>`);
  card.appendChild(head);
  panelBox.appendChild(card);

  const p = {run:r, card};

  if (r.hasTemp){
    const svg = el("svg", {});
    card.appendChild(svg);
    const temps = r.samples.map(s => s.temp).filter(v => v !== undefined && v !== null);
    const lo = Math.min(...temps), hi = Math.max(...temps);
    p.temp = makeChart(svg, {padL:52, yTicks:3, yLo:Math.min(0, lo), yHi:hi * 1.05,
      yFmt:v => v >= 100 ? v.toFixed(0) : v.toFixed(1)});
    p.kind = "temp";
  }
  if (r.hasPop){
    const svg = el("svg", {});
    card.appendChild(svg);
    // this method's own range: the global one is set by whichever method
    // wandered furthest, which flattens the population band to nothing
    let lo = Infinity, hi = -Infinity;
    r.samples.forEach(s => {
      [s.best, s.current, s.mean,
       (s.current !== null && s.spread ? s.current + s.spread : null)].forEach(v => {
        if (v === null || v === undefined || !isFinite(v)) return;
        lo = Math.min(lo, v); hi = Math.max(hi, v);
      });
    });
    if (!isFinite(lo)){ lo = 0; hi = 1; }
    const m = (hi - lo) * 0.08 || 1;
    p.pop = makeChart(svg, {padL:56, yTicks:3, yLo:lo - m, yHi:hi + m});
    p.kind = "pop";
  }
  if (r.segments && r.segments.length){
    const svg = el("svg", {class:"wide"});
    card.appendChild(svg);
    p.ops = makeChart(svg, {padL:52, yTicks:2, yLo:0, yHi:1,
      yFmt:v => (v*100).toFixed(0) + "%"});
    p.kind = "ops";
    const rows = h("div", "minirows");
    p.rowEls = {};
    r.trace.destroy_ops.forEach((name, i) => {
      const row = h("div", "mrow",
        `<span>${name}</span><span class="bar"><i></i></span><b>0</b>`);
      rows.appendChild(row);
      p.rowEls["d" + i] = {fill:row.querySelector("i"), val:row.querySelector("b")};
    });
    r.trace.repair_ops.forEach((name, i) => {
      const row = h("div", "mrow",
        `<span>${name}</span><span class="bar"><i></i></span><b>0</b>`);
      rows.appendChild(row);
      p.rowEls["r" + i] = {fill:row.querySelector("i"), val:row.querySelector("b")};
    });
    card.appendChild(rows);
  }

  const kvs = h("div");
  card.appendChild(kvs);
  p.kvs = kvs;
  panels.push(p);
});

function nth(n){ return n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"; }

// stacked shares of the roulette: this is what the weights actually decide
function shareSeries(segs, key, n){
  return segs.map(sg => {
    const w = sg[key];
    const tot = w.reduce((a,b) => a + (b||0), 0) || 1;
    return w.map(v => (v||0) / tot);
  });
}

function drawPanels(){
  panels.forEach(p => {
    const r = p.run;
    const xs = xsOf(r);
    if (p.temp){
      p.temp.layout(); p.temp.x0 = xMin(); p.temp.x1 = xMax() || 1;
      p.temp.grid(); p.temp.clear();
      const pts = [];
      r.samples.forEach((s, i) => {
        if (s.temp !== undefined && s.temp !== null) pts.push([xs[i], s.temp]);
      });
      p.temp.line(pts, {stroke:C.warn, "stroke-width":1.6});
      r.events.filter(e => e.kind === "reheat").forEach(e => {
        const x = axisMode === "t" ? e.t : e.step;
        p.temp.gData.appendChild(el("line", {x1:p.temp.px(x).toFixed(1), y1:12,
          x2:p.temp.px(x).toFixed(1), y2:(p.temp.h-22).toFixed(1),
          stroke:C.caution, "stroke-width":1, "stroke-dasharray":"2 2"}));
      });
      p.temp.setHead(playX);
    }
    if (p.pop){
      p.pop.layout(); p.pop.x0 = xMin(); p.pop.x1 = xMax() || 1;
      p.pop.grid(); p.pop.clear();
      const band = [], meanPts = [], bestPts = [];
      r.samples.forEach((s, i) => {
        if (s.mean === undefined || s.mean === null || s.current === null) return;
        const lo = s.current, hi = s.current + (s.spread || 0);
        band.push([xs[i], lo, hi]);
        meanPts.push([xs[i], s.mean]);
        bestPts.push([xs[i], s.current]);
      });
      p.pop.area(band, {fill:r.color, "fill-opacity":0.13});
      p.pop.line(meanPts, {stroke:r.color, "stroke-width":1.3, "stroke-dasharray":"4 3"});
      const popAttrs = {stroke:r.color, "stroke-width":1.9};
      if (r.dash) popAttrs["stroke-dasharray"] = r.dash;
      p.pop.line(bestPts, popAttrs);
      p.pop.setHead(playX);
    }
    if (p.ops){
      p.ops.layout(); p.ops.x0 = xMin(); p.ops.x1 = xMax() || 1;
      p.ops.grid(); p.ops.clear();
      const segs = r.segments;
      const sx = segs.map(sg => axisMode === "t" ? sg.t : sg.step);
      const shares = shareSeries(segs, "dw");
      const nOps = r.trace.destroy_ops.length;
      // stacked areas: the composition of what the roulette actually draws
      const base = new Array(segs.length).fill(0);
      for (let k = 0; k < nOps; k++){
        const pts = segs.map((sg, i) => [sx[i], base[i], base[i] + shares[i][k]]);
        p.ops.area(pts, {fill:opColor(k, nOps), "fill-opacity":0.82,
                         stroke:C.panel, "stroke-width":0.6});
        segs.forEach((sg, i) => { base[i] += shares[i][k]; });
      }
      p.ops.setHead(playX);
    }
  });
}

function opColor(i, n){
  const stops = ["#2C4F55", "#3E7078", "#9C6B12", "#8E2F63", "#3E7A3C", "#B23A22"];
  return stops[i % stops.length];
}

// ===========================================================================
// the playhead: one x, shared by every panel
// ===========================================================================
let playX = 0;
const scrub = document.getElementById("scrub");
const scrubFill = document.getElementById("scrubFill");
const scrubHead = document.getElementById("scrubHead");
const rdX = document.getElementById("rdX");
const rdBests = document.getElementById("rdBests");

function setPlayX(x, redraw){
  playX = clamp(x, xMin(), xMax() || 1);
  const f = (playX - xMin()) / xSpan();
  scrubFill.style.right = ((1 - f) * 100) + "%";
  scrubHead.style.left = (f * 100) + "%";
  scrub.setAttribute("aria-valuenow", String(Math.round(f * 100)));
  rdX.textContent = axisMode === "t" ? playX.toFixed(2) + "s"
                                     : Math.round(playX).toLocaleString();

  mainCh.setHead(playX);
  panels.forEach(p => {
    if (p.temp) p.temp.setHead(playX);
    if (p.pop) p.pop.setHead(playX);
    if (p.ops) p.ops.setHead(playX);
  });

  const bits = [];
  RUNS.forEach(r => {
    const i = idxAt(r, playX);
    const s = i >= 0 ? r.samples[i] : null;
    bits.push(`<span style="color:${r.color}">${r.label}</span> <b>${s ? fmt(s.best,0) : "–"}</b>`);
    updatePanel(r, s, i);
  });
  rdBests.innerHTML = bits.join("&nbsp;&nbsp;");
  if (redraw) { drawMain(); drawPanels(); }
}

function updatePanel(r, s, i){
  const p = panels.find(q => q.run === r);
  if (!p) return;
  const rows = [];
  if (s){
    rows.push(["Best so far", fmt(s.best, 1), "good"]);
    rows.push(["Working solution", fmt(s.current, 1), ""]);
    if (s.temp !== undefined && s.temp !== null)
      rows.push(["Temperature", fmt(s.temp, 2), ""]);
    if (s.mean !== undefined && s.mean !== null){
      rows.push(["Population mean", fmt(s.mean, 1), ""]);
      rows.push(["Population spread", fmt(s.spread, 1), ""]);
    }
    if (s.od !== undefined)
      rows.push(["Last draw",
        `${r.trace.destroy_ops[s.od]} → ${r.trace.repair_ops[s.or]}`, ""]);
    if (REF !== null && REF !== undefined && s.best !== null && REF > 0){
      const gap = 100 * (s.best - REF) / s.best;
      rows.push([`Gap to ${DATA.reference_label || "reference"}`,
                 gap.toFixed(1) + "%", ""]);
    }
    const done = r.events.filter(e => e.kind === "new_best" &&
      (axisMode === "t" ? e.t : e.step) <= playX).length;
    // A zero here is a real result -- the method never beat the solution it was
    // handed -- so label it as such rather than leaving it looking broken.
    rows.push(["Improvements on the start", String(done), done ? "" : "bad"]);
  } else {
    rows.push(["Not started yet", "–", ""]);
  }
  p.kvs.innerHTML = rows.map(x =>
    `<div class="kv"><span>${x[0]}</span><b class="${x[2]}">${x[1]}</b></div>`).join("");

  if (p.rowEls && r.segments.length){
    // the segment in force at the playhead
    let sg = null;
    for (const seg of r.segments){
      if ((axisMode === "t" ? seg.t : seg.step) <= playX) sg = seg; else break;
    }
    const dTot = sg ? (sg.dw.reduce((a,b)=>a+(b||0),0) || 1) : 1;
    const rTot = sg ? (sg.rw.reduce((a,b)=>a+(b||0),0) || 1) : 1;
    r.trace.destroy_ops.forEach((name, k) => {
      const cell = p.rowEls["d" + k];
      const share = sg ? (sg.dw[k] || 0) / dTot : 0;
      cell.fill.style.width = (share * 100).toFixed(1) + "%";
      cell.fill.style.background = opColor(k, r.trace.destroy_ops.length);
      cell.val.textContent = sg ? `${(share*100).toFixed(0)}% /${sg.du[k]}` : "–";
    });
    r.trace.repair_ops.forEach((name, k) => {
      const cell = p.rowEls["r" + k];
      const share = sg ? (sg.rw[k] || 0) / rTot : 0;
      cell.fill.style.width = (share * 100).toFixed(1) + "%";
      cell.fill.style.background = C.accent2;
      cell.val.textContent = sg ? `${(share*100).toFixed(0)}% /${sg.ru[k]}` : "–";
    });
  }
}

// ===========================================================================
// transport
// ===========================================================================
function seekFromEvent(ev){
  const r = scrub.getBoundingClientRect();
  setPlayX(xMin() + ((ev.clientX - r.left) / r.width) * xSpan());
}
let scrubbing = false;
scrub.addEventListener("pointerdown", ev => {
  scrubbing = true; pause(); scrub.setPointerCapture(ev.pointerId); seekFromEvent(ev);
});
scrub.addEventListener("pointermove", ev => { if (scrubbing) seekFromEvent(ev); });
["pointerup","pointercancel"].forEach(e => scrub.addEventListener(e, ev => {
  scrubbing = false; try { scrub.releasePointerCapture(ev.pointerId); } catch(x){}
}));
scrub.addEventListener("keydown", ev => {
  const span = xSpan(), big = span / 20, small = span / 200;
  if (ev.key === "ArrowRight") setPlayX(playX + (ev.shiftKey ? big : small));
  else if (ev.key === "ArrowLeft") setPlayX(playX - (ev.shiftKey ? big : small));
  else if (ev.key === "Home") setPlayX(xMin());
  else if (ev.key === "End") setPlayX(xMax());
  else return;
  ev.preventDefault(); pause();
});

let playing = false, speed = 1, ticker = null;
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const ICON_PLAY = '<path d="M3 1.5v13l11-6.5z"/>';
const ICON_PAUSE = '<path d="M3 1.5h4v13H3zM9 1.5h4v13H9z"/>';
function step(){
  // one pass of the whole run takes ~9 seconds at 1x, whatever the axis
  const dt = gsap.ticker.deltaRatio(60) / 60;
  const nx = playX + dt * speed * xSpan() / 9;
  if (nx >= (xMax() || 1)){ setPlayX(xMax()); pause(); return; }
  setPlayX(nx);
}
function play(){
  if (playing) return;
  if (playX >= (xMax() || 1) - 1e-9) setPlayX(xMin());
  playing = true;
  playIcon.innerHTML = ICON_PAUSE;
  playBtn.setAttribute("aria-label", "Pause");
  ticker = step; gsap.ticker.add(ticker);
}
function pause(){
  if (!playing) return;
  playing = false;
  playIcon.innerHTML = ICON_PLAY;
  playBtn.setAttribute("aria-label", "Play");
  if (ticker){ gsap.ticker.remove(ticker); ticker = null; }
}
playBtn.addEventListener("click", () => playing ? pause() : play());
document.getElementById("speedGroup").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  speed = parseFloat(b.dataset.s);
  [...ev.currentTarget.children].forEach(x => x.classList.toggle("on", x === b));
});
document.getElementById("fitGroup").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b || b.dataset.fit === yFit) return;
  yFit = b.dataset.fit;
  [...ev.currentTarget.children].forEach(x => x.classList.toggle("on", x === b));
  redrawAll();
});
document.getElementById("axisGroup").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b || b.dataset.x === axisMode) return;
  const frac = (playX - xMin()) / xSpan();
  axisMode = b.dataset.x;
  [...ev.currentTarget.children].forEach(x => x.classList.toggle("on", x === b));
  updateAxisNote();
  setPlayX(xMin() + frac * xSpan(), true);
});
document.addEventListener("keydown", ev => {
  if (ev.target && /input|textarea/i.test(ev.target.tagName)) return;
  if (ev.code === "Space"){ ev.preventDefault(); playing ? pause() : play(); }
});

function updateAxisNote(){
  const labels = [...new Set(RUNS.map(r => r.step_label))];
  document.getElementById("axisNote").textContent = axisMode === "t"
    ? "x: wall-clock seconds"
    : `x: ${labels.join(" / ")} index — not comparable across methods`;
  document.getElementById("axStart").textContent = axisMode === "t"
    ? xMin().toFixed(2) + "s" : Math.round(xMin()).toLocaleString();
  document.getElementById("axMid").textContent = axisMode === "t"
    ? (xMin() + xSpan()/2).toFixed(1) + "s"
    : Math.round(xMin() + xSpan()/2).toLocaleString();
  document.getElementById("axEnd").textContent = axisMode === "t"
    ? xMax().toFixed(1) + "s" : Math.round(xMax()).toLocaleString();
}

// ===========================================================================
// the caveat, stated on the page rather than left to the reader
// ===========================================================================
(function(){
  const seeds = [...new Set(RUNS.map(r => r.seed))];
  const strided = RUNS.filter(r => r.trace.stride > 1);
  const bits = [];
  bits.push(`<b>One run per method</b> — ${seeds.length === 1 ? `seed ${seeds[0]}` :
    `seeds ${seeds.join(", ")}`}. These are anecdotes, not distributions: a metaheuristic's
    spread across seeds is the thing that decides whether one method really beats another,
    and that lives in <code>drp/eval/stats.py</code> (Wilcoxon / Friedman + Nemenyi,
    bootstrap CIs), not here.`);
  if (strided.length){
    bits.push(`Sampled every ${strided.map(r => `${r.trace.stride} ${r.step_label}s (${r.label})`).join(", ")}
      to keep the page small — uniformly across the whole run, not truncated. Improvements
      and reheats are recorded in full and are never dropped.`);
  }
  if (axisMode === "step"){ /* note is on the chart heading */ }
  document.getElementById("caveat").innerHTML = bits.join(" ");
})();

// ===========================================================================
// go
// ===========================================================================
function redrawAll(){ drawMain(); drawPanels(); setPlayX(playX); }
updateAxisNote();
redrawAll();
setPlayX(xMax());

let raf = 0;
new ResizeObserver(() => {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(redrawAll);
}).observe(document.querySelector(".console"));

if (!reduced){
  gsap.from(mainSvg, {opacity:0, duration:.5, ease:"power2.out"});
  gsap.from(".panels .card", {opacity:0, y:8, duration:.45, stagger:.06, ease:"power2.out"});
}
})();
</script>
</body>
</html>
