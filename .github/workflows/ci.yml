name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The fast subset: correctness of the model, the Split DP, the bounds and
      # the formats. Runs on every push and must stay under a couple of minutes.
      # The browser tests are marked `slow` as well as `browser` precisely so
      # this selector does not pick them up -- this job installs no browser.
      - name: Fast tests
        run: pytest -q -m "not slow" --durations=10

      - name: CLI smoke test
        run: |
          drp generate --n 12 --drones 4 --zones 2 --seed 7 -o /tmp/inst.json
          drp solve /tmp/inst.json --method alns --time 5 -o /tmp/sol.json
          drp solve /tmp/inst.json --method bnb --time 5
          drp export /tmp/sol.json --instance /tmp/inst.json --format geojson -o /tmp/out.geojson
          drp show /tmp/sol.json --instance /tmp/inst.json -o /tmp/routes.png --web /tmp/flight.html
          # Vector export (roadmap 2.5): the extension picks the backend, so a
          # broken suffix map fails here rather than in someone's report.
          drp show /tmp/sol.json --instance /tmp/inst.json -o /tmp/routes.svg
          drp show /tmp/sol.json --instance /tmp/inst.json -o /tmp/routes.pdf --theme chart
          test -s /tmp/routes.svg && test -s /tmp/routes.pdf
          grep -q "<svg" /tmp/routes.svg

      - name: Experiment pipeline smoke test
        run: |
          python run_experiments.py --quick
          python generate_figures.py --time-limit 2

      - name: Upload figures
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            results/*.png
            results/*.pdf
          if-no-files-found: warn

  browser:
    name: browser tests (pages)
    runs-on: ubuntu-latest
    # On every push and every pull request, not just on main. The whole reason
    # this job exists is that JavaScript regressions are invisible in review --
    # deferring it to main means a pull request can break a page and merge
    # green. It runs in parallel with the jobs above, so it costs wall-clock
    # time only if it becomes the longest of them; measured, it does not.
    #
    # Honest cost: ~40 s to install the package, ~25 s for Chromium on a cache
    # hit (~90 s cold, once per Playwright version), and ~60-75 s for the 67
    # tests. So roughly 2 minutes warm, 3 cold. The fast job above is unchanged
    # at ~2.5 minutes plus its smoke steps.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,browser]"

      - name: Playwright version
        id: pw
        run: echo "v=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # The pages fetch GSAP from cdnjs. The tests serve it from this cache
      # instead, so a CDN hiccup cannot turn into a red build; the first run
      # after a cache miss downloads it once.
      - name: Cache GSAP
        uses: actions/cache@v4
        with:
          path: tests/browser/.cache
          key: gsap-3.12.5

      - name: Browser tests
        run: pytest -q -m browser --durations=10

  slow:
    name: brute-force verification
    runs-on: ubuntu-latest
    # The exhaustive-enumeration tests are the ones that would catch a silently
    # wrong "proven optimal", so they run on main and on demand rather than on
    # every pull request.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # `not browser` rather than everything: the browser tests have their own
      # job with a browser in it. Without this they would be silently *skipped*
      # here (no playwright installed), which looks like coverage and is not.
      - name: Full suite including brute-force parity
        run: pytest -q -m "not browser" --durations=15
