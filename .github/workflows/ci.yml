name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The fast subset: correctness of the model, the Split DP, the bounds and
      # the formats. Runs on every push and must stay under a couple of minutes.
      - name: Fast tests
        run: pytest -q -m "not slow" --durations=10

      - name: CLI smoke test
        run: |
          drp generate --n 12 --drones 4 --zones 2 --seed 7 -o /tmp/inst.json
          drp solve /tmp/inst.json --method alns --time 5 -o /tmp/sol.json
          drp solve /tmp/inst.json --method bnb --time 5
          drp export /tmp/sol.json --instance /tmp/inst.json --format geojson -o /tmp/out.geojson
          drp show /tmp/sol.json --instance /tmp/inst.json -o /tmp/routes.png --web /tmp/flight.html

      # Roadmap §3: the scenario builder, the real-geography dataset, the
      # benchmark importers and the flight-plan export, end to end.
      - name: Scenario, import and mission-export smoke test
        run: |
          drp build --example -o /tmp/scenario.json
          drp build /tmp/scenario.json -o /tmp/geo.json
          drp solve /tmp/geo.json --method alns --time 5 -o /tmp/geosol.json
          drp export /tmp/geosol.json --instance /tmp/geo.json --format qgc -o /tmp/missions
          drp import tests/data/toy-n8-k3.vrp --format cvrplib -o /tmp/toy.json
          drp import tests/data/toy-solomon.txt --customers 8 -o /tmp/solomon.json
          drp solve /tmp/toy.json --method bnb --time 30

      # The replay page in a real browser (roadmap §3.4). Ubuntu runners ship
      # Chrome; where they do not, the tests skip rather than fail, so this
      # step reports what was actually covered.
      - name: Rendered-page smoke test
        run: |
          python -m pytest -q tests/test_web_headless.py -rs

      - name: Experiment pipeline smoke test
        run: |
          python run_experiments.py --quick
          python generate_figures.py --time-limit 2

      - name: Upload figures
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: results/*.png
          if-no-files-found: warn

  slow:
    name: brute-force verification
    runs-on: ubuntu-latest
    # The exhaustive-enumeration tests are the ones that would catch a silently
    # wrong "proven optimal", so they run on main and on demand rather than on
    # every pull request.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full suite including brute-force parity
        run: pytest -q --durations=15
